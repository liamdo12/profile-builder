services:
  # ── PostgreSQL Database ───────────────────────────────────
  postgres:
    image: postgres:16
    container_name: pb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot Application ──────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pb-app
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OPENAI_MINI_MODEL: ${OPENAI_MINI_MODEL:-gpt-5.2}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      postgres:
        condition: service_healthy

  # ── Playwright Crawler Microservice ──────────────────────────
  crawler:
    build:
      context: ../crawler
      dockerfile: Dockerfile
    container_name: pb-crawler
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      MAX_RESULTS_PER_SOURCE: ${CRAWLER_MAX_RESULTS:-20}
      REQUEST_TIMEOUT_MS: ${CRAWLER_TIMEOUT_MS:-120000}
      MIN_DELAY_MS: ${CRAWLER_MIN_DELAY_MS:-1000}
      MAX_DELAY_MS: ${CRAWLER_MAX_DELAY_MS:-3000}
      MAX_RETRIES: ${CRAWLER_MAX_RETRIES:-3}
      PROXY_URL: ${PROXY_URL:-}
      PLAYWRIGHT_HEADLESS: "true"
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
