spring:
  application:
    name: profile-builder

  # ── File Upload ────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 2MB
      max-request-size: 2MB

  # ── Database ──────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# ── Server ────────────────────────────────────────────────
server:
  port: ${SERVER_PORT}

# ── Application ───────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 86400000
  admin:
    email: admin@profilebuilder.com
    username: admin
    password: ${ADMIN_PASSWORD}
  upload:
    dir: ${UPLOAD_DIR}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  tavily:
    api-key: ${TAVILY_API_KEY}
  openai:
    api-key: ${OPENAI_API_KEY}
  ai:
    main-model:
      model-name: ${OPENAI_MODEL:gpt-4o}
      temperature: 0.5
    mini-model:
      model-name: ${OPENAI_MINI_MODEL:gpt-5.2}
      temperature: 0.5
  telegram:
    api-base-url: https://api.telegram.org
    bot-token: ${TELEGRAM_BOT_TOKEN:}
  crawler:
    base-url: ${CRAWLER_SERVICE_URL:http://localhost:3001}
    timeout-seconds: 120
    retention-days: 30

# ── Actuator ──────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
